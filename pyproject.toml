[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-agent"
version = "0.1.0"
description = "Local-first LLM tools that must cite their evidence: job posting analysis and a bounded read-only workspace agent, with an evaluation harness"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.setuptools.package-data]
job_agent = ["*.swift", "*.js"]
