[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-lab"
version = "0.1.0"
description = "A read-only local model agent whose every action is policy-checked, logged, replayable, and evaluated"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["local_agent*"]

